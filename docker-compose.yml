version: '3.9'
services:
  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=sqlite:///./mvai.db
      - APP_ENV=production
    volumes:
      - ./uploads:/app/uploads
      - ./exports:/app/exports
      - ./image-library:/app/image-library
      - ./image-cache:/app/image-cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
